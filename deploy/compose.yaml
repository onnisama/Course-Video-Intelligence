name: course-video-integration

services:
  db:
    image: postgres:17.12-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-course_video_integration}
      POSTGRES_USER: ${POSTGRES_USER:-course_video_integration}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment file}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      start_period: 10s
      retries: 12
    restart: unless-stopped

  backend:
    image: course-video-integration-backend:${INTEGRATION_IMAGE_TAG:-local}
    build: ../backend
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-course_video_integration}
      POSTGRES_USER: ${POSTGRES_USER:-course_video_integration}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment file}
    networks:
      - default
      - database
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 8
    restart: unless-stopped

  web:
    image: course-video-integration-web:${INTEGRATION_IMAGE_TAG:-local}
    build: ../frontend
    ports:
      - "127.0.0.1:${INTEGRATION_PORT:-18080}:80"
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 8
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  database:
    internal: true
